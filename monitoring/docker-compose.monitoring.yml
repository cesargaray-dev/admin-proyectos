# ==============================================================================
# Observability & Monitoring Stack — Admin Proyectos (Unidad III DevOps)
# Services: Prometheus (9090), Alertmanager (9093), Grafana (3000),
#           Loki (3100), Promtail (log collector via Docker socket)
# ==============================================================================
# Port allocation check (zero collisions):
#   - Jenkins:      8080, 50000
#   - API Gestor:   8081
#   - Cliente Web:  8082
#   - SonarQube:    9000
#   - Prometheus:   9090
#   - Alertmanager: 9093
#   - Grafana:      3000
#   - Loki:         3100
# ==============================================================================

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: admin-proyectos-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}"
      - "--web.enable-lifecycle"
    volumes:
      - ${PROMETHEUS_CONFIG:-./prometheus/prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - devops-net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: admin-proyectos-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - devops-net

  loki:
    image: grafana/loki:2.9.10
    container_name: admin-proyectos-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - devops-net

  promtail:
    image: grafana/promtail:2.9.10
    container_name: admin-proyectos-promtail
    restart: unless-stopped
    command:
      - "-config.file=/etc/promtail/config.yml"
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/tmp/positions
    depends_on:
      loki:
        condition: service_started
    networks:
      - devops-net

  grafana:
    image: grafana/grafana:11.2.2
    container_name: admin-proyectos-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Local-only dev defaults (override via monitoring/.env; never commit secrets)
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/admin-proyectos-devops.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - devops-net

volumes:
  prometheus_data:
  alertmanager_data:
  loki_data:
  promtail_positions:
  grafana_data:

networks:
  devops-net:
    name: devops-net
    driver: bridge
