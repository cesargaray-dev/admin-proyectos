# ==============================================================================
# Prometheus Configuration — Live Render Cloud HTTPS Targets
# ==============================================================================
# Usage:
#   1. Replace the two `*.onrender.com` hostnames below with the exact hostnames
#      from `terraform output api_url` and `terraform output client_url`
#      (hostnames ONLY, without `https://` or trailing slashes).
#   2. Launch Prometheus with this config:
#        $env:PROMETHEUS_CONFIG = "./prometheus/prometheus.render.yml"
#        docker compose -f monitoring/docker-compose.monitoring.yml up -d --force-recreate prometheus
#   3. Open http://localhost:9090/targets and http://localhost:3000 (Grafana).
#
# Note: 30s scrape interval and 15s timeout are chosen deliberately to respect
# Render Free Tier CPU/RAM limits and tolerate cold-start wakeups.
# ==============================================================================
global:
  scrape_interval: 30s
  scrape_timeout: 15s
  evaluation_interval: 30s
  external_labels:
    environment: "render-cloud"
    project: "admin-proyectos"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"
          tier: "observability"

  - job_name: "api-gestor"
    scheme: https
    metrics_path: "/actuator/prometheus"
    scrape_interval: 30s
    scrape_timeout: 15s
    static_configs:
      # Exact Render Backend hostname created by Terraform (`terraform output api_url`)
      - targets: ["admin-proyectos-api-gestor.onrender.com"]
        labels:
          service: "api-gestor"
          application: "Ejercicio5MyAPIGestor"
          tier: "backend"
          cloud_provider: "render"

  - job_name: "cliente"
    scheme: https
    metrics_path: "/actuator/prometheus"
    scrape_interval: 30s
    scrape_timeout: 15s
    static_configs:
      # Exact Render Frontend hostname created by Terraform (`terraform output client_url`)
      - targets: ["admin-proyectos-cliente.onrender.com"]
        labels:
          service: "cliente"
          application: "Ejercicio5Cliente"
          tier: "frontend"
          cloud_provider: "render"
