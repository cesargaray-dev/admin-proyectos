# ==============================================================================
# Prometheus Alert Rules — Spring Boot 3 / Micrometer (Admin Proyectos)
# ==============================================================================
groups:
  - name: admin-proyectos-slo-alerts
    interval: 15s
    rules:
      # 1. Availability: Microservice unreachable / scrape failing
      - alert: ServiceDown
        expr: up{job=~"api-gestor|cliente"} == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Servicio {{ $labels.job }} caido (DOWN)"
          description: "El endpoint /actuator/prometheus de {{ $labels.job }} ({{ $labels.instance }}) no responde desde hace mas de 1 minuto."

      # 2. Reliability: HTTP 5xx error ratio above 5% over 2 minutes
      - alert: HighHttpErrorRate5xx
        expr: |
          (
            sum by (job, service) (rate(http_server_requests_seconds_count{job=~"api-gestor|cliente", status=~"5.."}[2m]))
            /
            clamp_min(sum by (job, service) (rate(http_server_requests_seconds_count{job=~"api-gestor|cliente"}[2m])), 1e-9)
          ) > 0.05
          and
          sum by (job, service) (rate(http_server_requests_seconds_count{job=~"api-gestor|cliente"}[2m])) > 0
        for: 2m
        labels:
          severity: critical
          category: reliability
        annotations:
          summary: "Alta tasa de errores HTTP 5xx en {{ $labels.job }}"
          description: "El servicio {{ $labels.job }} supera el 5% de respuestas HTTP 5xx (valor actual: {{ $value | humanizePercentage }}) durante los ultimos 2 minutos."

      # 3. Latency: HTTP p95 latency above 1.5 seconds over 2 minutes
      - alert: HighHttpLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, job, service) (
              rate(http_server_requests_seconds_bucket{job=~"api-gestor|cliente", uri!~"/actuator.*"}[2m])
            )
          ) > 1.5
        for: 2m
        labels:
          severity: warning
          category: latency
        annotations:
          summary: "Latencia HTTP p95 elevada en {{ $labels.job }}"
          description: "El percentil 95 de latencia HTTP en {{ $labels.job }} supera 1.5s (valor actual: {{ $value | humanizeDuration }}) durante los ultimos 2 minutos."

      # 4. Saturation (Memory): JVM Heap usage above 85% of max heap
      - alert: HighJvmHeapUsage
        expr: |
          (
            sum by (job, service, instance) (jvm_memory_used_bytes{job=~"api-gestor|cliente", area="heap"})
            /
            sum by (job, service, instance) (jvm_memory_max_bytes{job=~"api-gestor|cliente", area="heap"} > 0)
          ) > 0.85
        for: 2m
        labels:
          severity: warning
          category: memory
        annotations:
          summary: "Uso elevado de memoria JVM Heap en {{ $labels.job }}"
          description: "El servicio {{ $labels.job }} ({{ $labels.instance }}) supera el 85% de su heap JVM maximo (valor actual: {{ $value | humanizePercentage }}) durante 2 minutos."

      # 5. Saturation (CPU): Process CPU usage above 85%
      - alert: HighProcessCpuUsage
        expr: process_cpu_usage{job=~"api-gestor|cliente"} > 0.85
        for: 2m
        labels:
          severity: warning
          category: cpu
        annotations:
          summary: "Uso elevado de CPU del proceso en {{ $labels.job }}"
          description: "El proceso JVM de {{ $labels.job }} ({{ $labels.instance }}) supera el 85% de uso de CPU (valor actual: {{ $value | humanizePercentage }}) durante 2 minutos."
