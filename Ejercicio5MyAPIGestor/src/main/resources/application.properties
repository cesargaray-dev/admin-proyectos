spring.application.name=Ejercicio5MyAPIGestor
server.port=${PORT:8081}

# Base de datos (Neon PostgreSQL via variables de entorno; valores locales seguros sin secretos)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/neondb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.connection-timeout=30000
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# Observabilidad: Actuator, Micrometer Prometheus y OpenTelemetry Tracing
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,250ms,500ms,1s,1500ms,2s,5s
management.prometheus.metrics.export.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.info.env.enabled=true

# Informacion de la aplicacion (/actuator/info)
info.app.name=${spring.application.name}
info.app.description=Proyecto My API Rest
info.app.version=1.0.0
info.app.java.version=21

# Correlacion de logs con traceId y spanId de OpenTelemetry
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
