spring.application.name=Ejercicio5Cliente
server.port=${PORT:8082}

# URL del microservicio backend (configurable por variable de entorno API_BASE_URL)
api.base-url=${API_BASE_URL:http://localhost:8081}

# Observabilidad: Actuator, Micrometer Prometheus y OpenTelemetry Tracing
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,250ms,500ms,1s,1500ms,2s,5s
management.prometheus.metrics.export.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.info.env.enabled=true

# Informacion de la aplicacion (/actuator/info)
info.app.name=${spring.application.name}
info.app.description=Interfaz del Gestor de Proyectos
info.app.version=1.0.0
info.app.java.version=21

# Correlacion de logs con traceId y spanId de OpenTelemetry
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
